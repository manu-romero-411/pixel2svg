[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelart2svg"
version = "1.1.1"
description = "Convert pixel art (PNG) into a pixel-perfect vector SVG"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "Pillow>=9.0",
    "numpy>=1.20",
]

[project.scripts]
pixelart2svg = "pixelart2svg:main"