name: Publish to PyPI

on:
  push:
    tags:
      - 'v*' # Se activa cada vez que hagas un tag que empiece por 'v' (ej. v1.1.0)

jobs:
  deploy:
    name: Build and push to PyPI
    runs-on: ubuntu-latest
    
    # Permisos necesarios para Trusted Publishing (OIDC)
    permissions:
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package (sdist and wheel)
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
